spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 99
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:google-genai}
      embedding:
        text: ${AI_EMBEDDING_PROVIDER:google-genai}
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
            temperature: 0.1
        embedding:
          api-key: ${GOOGLE_API_KEY}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
              dimensions: 768
    vectorstore:
      pgvector:
        schema-name: ai
        table-name: policy_vectors_gemini
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  ai:
    enabled: ${AI_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.elms.leave: INFO